# ==============================================================================
# configs/optee/ftpm_pkcs11.conf — OP-TEE OS Hardening & TA Configuration
# ==============================================================================
# Description:
#   Build options for OP-TEE Core on QEMU ARMv8-A virt platform.
#   Enables PKCS#11 Cryptoki TA, virtual RPMB secure storage, and early fTPM TA.
# ==============================================================================

# 64-bit Core & Secure World Arch
CFG_ARM64_core=y
CFG_USER_TA_TARGETS=ta_arm64

# Logging & Diagnostic (Captured by tests/test_boot_optee.py)
CFG_TEE_CORE_LOG_LEVEL=3
CFG_TEE_CORE_DEBUG=y

# Cryptographic & Cryptoki Services (SRD-KEY-002, SRD-COM-001)
CFG_PKCS11_TA=y
CFG_CRYPTO_SHA256=y
CFG_CRYPTO_RSA=y
CFG_CRYPTO_ECC=y

# RPMB Virtual Secure Storage (SRD-TEE-003)
# Routes Secure Storage objects strictly to RPMB partition rather than Linux REE FS
CFG_RPMB_FS=y
CFG_RPMB_FS_DEV_ID=0
CFG_RPMB_TESTKEY=y
CFG_REE_FS=n

# Early TA Support (For initializing fTPM TA prior to Normal World boot)
CFG_EARLY_TA=y

# Secure World Memory & Heap
CFG_CORE_HEAP_SIZE=131072
CFG_CORE_RESERVED_SHM=y
CFG_SECURE_TIME_SOURCE_CNTPCT=y
