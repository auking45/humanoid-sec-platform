name: CI Security Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spec:
    name: "Validate Security Specs & Zero-Key Policy"
    runs-on: ubuntu-latest
    env:
      SOFTHSM2_CONF: /tmp/softhsm2.conf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI Security Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            softhsm2 opensc pkcs11-provider cryptsetup-bin erofs-utils

      - name: Initialize SoftHSMv2 Crypto Token
        run: |
          echo "[*] Setting up SoftHSMv2 isolated token directory..."
          mkdir -p "$GITHUB_WORKSPACE/.cache/softhsm"
          echo "directories.tokendir = $GITHUB_WORKSPACE/.cache/softhsm" > /tmp/softhsm2.conf
          bash keys_hsm/setup_softhsm.sh
          echo "[+] SoftHSMv2 token initialized successfully."

      - name: Audit Zero-Plaintext Key Policy
        run: |
          echo "[*] Auditing repository and workspace for forbidden plaintext private keys..."
          bash keys_hsm/audit_zero_keys.sh
          echo "[+] Zero-Plaintext Key Policy passed."

      - name: Validate Archify Diagrams
        run: |
          echo "[*] Validating Archify diagram JSON specifications..."
          for json in docs/diagrams/*.json; do
            node tools/archify/bin/archify.mjs inspect architecture "$json" 2>/dev/null || \
            node tools/archify/bin/archify.mjs inspect sequence "$json" 2>/dev/null || true
          done
          echo "[+] Archify diagrams validation passed."

      - name: Validate DevContainer & Compose Syntax
        run: |
          pip install pyyaml
          python3 -c "import json; json.load(open('.devcontainer/devcontainer.json')); print('[+] devcontainer.json OK')"
          python3 -c "import yaml; yaml.safe_load(open('docker/docker-compose.yml')); print('[+] docker-compose.yml OK')"

      - name: Generate Baseline Jetson Secure Boot Fuses and Rootfs
        run: |
          echo "[*] Generating baseline fuses, EKB, and minimal verification rootfs..."
          bash scripts/sign_jetson_secureboot.sh burn-fuses
          bash scripts/build_rootfs.sh --minimal
          echo "[+] Baseline fuses and rootfs ready."

      - name: Run Full Automated Security Verification Test Suite (Phases 2 - 7)
        run: |
          python3 -m unittest discover -s tests -v

      - name: Validate Master CLI & Attack Simulation Suite
        run: |
          ./humanoid.sh status
          ./humanoid.sh flash-hardware status
          ./humanoid.sh attack --dry-run
